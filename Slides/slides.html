.center[
# Literature - geography versus institutions
]

.pull-left[
### Institutions vs geography
- Institutions are the primary driver of economic development (Acemoglu et al., 2001)
- Geography acts through institutions (Rodrik et al., 2004)
- Geography plays a role (which is smaller than instituions) (Ketterer and Rodríguez-Pose, 2018)
]

.pull-right[
### Geography
- Henderson et al. (2018): Geography explain 47 pct of nightlight variation
- Even large disruptions does not change long-run outcomes (Davis and Weinstein, 2002) `\(\rightarrow\)` Path dependence or first nature geography?
- Bleakly and Lin (2012): Path dependence is part of the answer
- What about first nature? Extreme long-run: Diamond (1997); Allen et al. (2023); Matranga (2024)
]

name: timeline
# Timeline

--

#### Pre-event: 
- 1085-1208: Natural western channel closed because of gradual land rises (since the last ice age)
- Limfjord towns lacked far behind the rest of the country

--

#### Event:
- 1825: Breach of Agger Isthmus
- 1834: Ships start consistently passing through a new natural channel 
- 1841: Independent trade rights to west Limfjord market towns 
- 1841-1860: 'Golden age of trade'
- 1860-1900: Population growth + changed occupational structure

# Market Access
.pull-left[
Based on cost distance from parishes to harbours: 
`$${MA}_p = \sum_{h \in H} [CostDist(p, h)]^\theta$$`
- CostDist - Dijkstra's algorithm and 1/10 land/sea ratio 
- `\(\theta = -1\)`  
- Findings robust to other levels of `\(\theta\)` and Cost Distance function specificaitons.
]

# Some considerations about archaeological data

--

.pull-left[
### Problems
1. If a coin finding is dated to the period 745-1066, in which decade does it then count?
  + *All of them?*
  + What about a coin finding dated to between 1030 and 1039?
2. Soil type shapes the economy but also availability of archaeological remains
  + Huge selection problem
3. Why would coins be left?
  + Trade? Distress?
]

--
.pull-right[
### How to address them
1. Use Bayesian Monte Carlo sampling procedure to estimate: `\(Pr(\{c\}|t)\)` from `\(Pr(t|c)\)`
   + *Intution: Interpret arhcaeological dating as a probability distribution*
2. Matching
   + *Greedy propensity score matching - same soil profiles*
3. Use several different outcomes
   + Building, coins, other?

]

# Estimator of coin probability
.pull-left[
- **Objective:** We want to know *how likely it is that coin was left at a particular time `\(t\)`*
- **What we have:** Observations of individual coin findings and a distribution of times `\(t\)`, which are likely for a specific coin finding in a place `\(i\)` 

**In equation form:**
- What we have: `\(P_i(t|c)\)`: Probability of `\(t\)` given one coin 
- What we want: `\(P_i(\{c\}|t)\)`: Probability of *any* coins in time `\(t\)`
]
--
.pull-right[
### The solution
Bayes formula and Monte Carlo
- Simple to sample from this distribution
- Sample `\(t\)` from each coin 
- Count frequency of coin findings
`$$P(\{c\}|t)=\left[1-\prod_{c=1}^{K_i} \left( 1 - P(t|c) \right)\right] P(\{c\})$$`
where it is assumed that
`\(P(t|c)\sim \mathscr{U}(Year_{min}^c; Year_{max}^c)\)` or
`\(P(t|c)\sim \mathscr{N}(\mu_c, \sigma_c),\)`
`\(\sigma_c=\frac{(Year_{max}^c - Year_{min}^c)}{1.96}\)`
]

(function(d) {

  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
